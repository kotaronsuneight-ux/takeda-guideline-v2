<template id="review-template"><div class="intro"><h2>デザイン審査基準</h2><p>こちらのページでは、加盟校様・広告代理店様が独自に販促物をデザインした際に行われる、デザイン審査の審査基準を記載しています。ガイドラインを参考にしていただき、より武田塾のイメージに沿った販促物を制作してください。</p></div><section class="original-chapter"><h2>加盟校様・広告代理店様へのお願い</h2><div class="original-intro-grid"><div class="original-item"><h3>加盟校様へ</h3><p>発注先の広告代理店様へこちらのURLをお伝えいただいて問題ありません。</p></div><div class="original-item"><h3>広告代理店様へ</h3><ul class="source-bullets"><li>制作会社の作成例としてホームページへの掲載はご遠慮ください。</li><li>加盟校様が制作依頼したデザインを、別会社が運営する加盟校様のデザインとして転用することはご遠慮ください。</li><li>タレント様の画像データは流出しないようお願いします。</li></ul></div></div></section><section class="original-chapter"><h2>武田塾イメージカラーについて</h2><h3 class="original-subhead">基本カラー</h3><p>ベースは下記カラーでデザインを制作してください。</p><div class="source-colors"><div class="source-color"><div class="source-swatch" style="background:#231815"></div><strong>黒</strong><small>K100<br/>#231815</small></div><div class="source-color"><div class="source-swatch" style="background:#c11920"></div><strong>基本赤</strong><small>C25 M100 Y100<br/>#c11920</small></div><div class="source-color"><div class="source-swatch" style="background:#e60012"></div><strong>赤（イレギュラー）</strong><small>M100 Y100<br/>#e60012</small></div><div class="source-color"><div class="source-swatch" style="background:#ffffff"></div><strong>白</strong><small><br/>#ffffff</small></div></div><h3 class="original-subhead">あのちゃんカラー</h3><figure class="source-figure"><img alt="あのちゃんカラーの指定と使用例（元ガイドライン）" data-fallbacks="https://suneight.design/takedaguide/ano_image_color.jpg|https://suneight.design/takedaguide/img/ano_image_color.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/ano_image_color.jpg"/><figcaption>あのちゃんカラーの指定と使用例（元ガイドライン）</figcaption></figure></section><section class="original-chapter"><h2>使用フォントについて</h2><p>基本はゴシック体・明朝体をご使用ください。</p><p>Mac端末での制作が可能であれば、ヒラギノフォント（ゴシック・明朝体）をご使用ください。</p><div class="original-item"><h3>文字装飾は極力控えてください。</h3><p>武田塾のデザインは基本、フラットなデザインのため、文字フチの追加やシャドウの追加は控えてください。</p><figure class="source-figure"><img alt="文字装飾に関する元ガイドラインのNG・OK例" data-fallbacks="https://suneight.design/takedaguide/guideline1.jpg|https://suneight.design/takedaguide/img/guideline1.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline1.jpg"/><figcaption>文字装飾に関する元ガイドラインのNG・OK例</figcaption></figure></div><div class="original-item"><h3>校舎看板に過度な文字要素NG</h3><p>例：チラシの内容をそのまま掲載するなど。</p></div></section><section class="original-chapter"><h2>デザイン審査でよくある指摘点</h2><div class="original-item"><h3>01｜文字のグリッド（縦横のライン）が揃っていない。</h3><figure class="source-figure"><img alt="文字のグリッド（縦横のライン）が揃っていない。（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline2.jpg|https://suneight.design/takedaguide/img/guideline2.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline2.jpg"/><figcaption>文字のグリッド（縦横のライン）が揃っていない。（元ガイドラインの参考画像）</figcaption></figure></div><div class="original-item"><h3>02｜文字の縦横比が変わっている。</h3><figure class="source-figure"><img alt="文字の縦横比が変わっている。（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline3.jpg|https://suneight.design/takedaguide/img/guideline3.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline3.jpg"/><figcaption>文字の縦横比が変わっている。（元ガイドラインの参考画像）</figcaption></figure></div><div class="original-item"><h3>03｜使用フォントが細すぎる。</h3><figure class="source-figure"><img alt="使用フォントが細すぎる。（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline4.jpg|https://suneight.design/takedaguide/img/guideline4.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline4.jpg"/><figcaption>使用フォントが細すぎる。（元ガイドラインの参考画像）</figcaption></figure></div><div class="original-item"><h3>04｜「無料受験相談受付中!!」は白背景の場合、基本的に赤枠・赤文字</h3><p>※「無料受験相談実施中」は使用せず、「無料受験相談受付中」を使用してください。</p><figure class="source-figure"><img alt="「無料受験相談受付中!!」は白背景の場合、基本的に赤枠・赤文字（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline5.jpg|https://suneight.design/takedaguide/img/guideline5.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline5.jpg"/><figcaption>「無料受験相談受付中!!」は白背景の場合、基本的に赤枠・赤文字（元ガイドラインの参考画像）</figcaption></figure></div><div class="original-item"><h3>05｜情報量が多く、広告枠に対し余白がなさすぎるデザイン</h3><figure class="source-figure"><img alt="情報量が多く、広告枠に対し余白がなさすぎるデザイン（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline6.jpg|https://suneight.design/takedaguide/img/guideline6.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline6.jpg"/><figcaption>情報量が多く、広告枠に対し余白がなさすぎるデザイン（元ガイドラインの参考画像）</figcaption></figure></div><div class="original-item"><h3>06｜広告枠に対し、背景やデザインがずれている。</h3><figure class="source-figure"><img alt="広告枠に対し、背景やデザインがずれている。（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline7.jpg|https://suneight.design/takedaguide/img/guideline7.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline7.jpg"/><figcaption>広告枠に対し、背景やデザインがずれている。（元ガイドラインの参考画像）</figcaption></figure></div><div class="original-item"><h3>07｜雛形から色味が変わっているもの。</h3><figure class="source-figure"><img alt="雛形から色味が変わっているもの。（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline8.jpg|https://suneight.design/takedaguide/img/guideline8.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline8.jpg"/><figcaption>雛形から色味が変わっているもの。（元ガイドラインの参考画像）</figcaption></figure></div><div class="original-item"><h3>08｜武田塾のイメージと異なるデザイン。</h3><figure class="source-figure"><img alt="武田塾のイメージと異なるデザイン。（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline9.jpg|https://suneight.design/takedaguide/img/guideline9.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline9.jpg"/><figcaption>武田塾のイメージと異なるデザイン。（元ガイドラインの参考画像）</figcaption></figure></div><div class="original-item"><h3>09｜色数が多すぎるデザイン（基本カラー3色で作成する）</h3><figure class="source-figure"><img alt="色数が多すぎるデザイン（基本カラー3色で作成する）（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline10.jpg|https://suneight.design/takedaguide/img/guideline10.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline10.jpg"/><figcaption>色数が多すぎるデザイン（基本カラー3色で作成する）（元ガイドラインの参考画像）</figcaption></figure></div><div class="original-item"><h3>10｜ロゴは必ず正規のものを使用する。縦横比の変更不可。</h3><p>「日本初！授業はしない塾。武田塾」までで商標を取っているため、設置上の規制がある場合を除き、基本的に「日本初！授業はしない。」は外さないでください。</p><figure class="source-figure"><img alt="ロゴは必ず正規のものを使用する。縦横比の変更不可。（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline11.jpg|https://suneight.design/takedaguide/img/guideline11.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline11.jpg"/><figcaption>ロゴは必ず正規のものを使用する。縦横比の変更不可。（元ガイドラインの参考画像）</figcaption></figure></div><div class="original-item"><h3>公式ロゴのNG例</h3><ul class="source-bullets"><li>「日本初！授業をしない。」と「武田塾」の比率が違う。</li><li>ハンコの位置がずれている・ハンコのマスクが外れている。</li><li>武田塾の飛沫が消えている。</li><li>色味が違う（K100％（黒）、またはCMYK0％（白）が正規）。</li></ul></div><div class="original-item"><h3>11｜デザインがロゴと校舎名のみの場合、校舎名はゴシック体</h3><figure class="source-figure"><img alt="デザインがロゴと校舎名のみの場合、校舎名はゴシック体（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline12.jpg|https://suneight.design/takedaguide/img/guideline12.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline12.jpg"/><figcaption>デザインがロゴと校舎名のみの場合、校舎名はゴシック体（元ガイドラインの参考画像）</figcaption></figure></div><div class="original-item"><h3>12｜住所・電話番号は基本的に半角英数字を使用する。</h3><figure class="source-figure"><img alt="住所・電話番号は基本的に半角英数字を使用する。（元ガイドラインの参考画像）" data-fallbacks="https://suneight.design/takedaguide/guideline13.jpg|https://suneight.design/takedaguide/img/guideline13.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/guideline13.jpg"/><figcaption>住所・電話番号は基本的に半角英数字を使用する。（元ガイドラインの参考画像）</figcaption></figure></div></section><section class="original-chapter"><h2>武田塾チャンネルキャラクターガイドライン</h2><h3 class="original-subhead">使用可能範囲</h3><div class="original-intro-grid"><div class="original-item"><h3>使用可能なもの</h3><ul class="source-bullets"><li>チラシなどの印刷販促物（フリーペーパーなどの印刷物への出稿を含む）</li><li>看板</li><li>POP</li><li>バナー</li><li>SNSのカバー画像</li></ul></div><div class="original-item"><h3>使用不可なもの</h3><ul class="source-bullets"><li>ブログへの画像差し込み</li><li>SNSへの投稿・プロフィール画像</li><li>Webサイト（takeda.tvの校舎ページ・独自サイト・LPなど）</li></ul></div></div><h3 class="original-subhead">使用にあたっての注意点</h3><div class="original-item"><h3>武田塾の公式な宣伝に用いる場合に限って使用可能</h3><p>個人のアカウントなどで私用に用いることはできません。</p></div><div class="original-item"><h3>キャラクターの縦横比は変更不可。</h3><figure class="source-figure"><img alt="キャラクターの縦横比NG・OK比較" data-fallbacks="https://suneight.design/takedaguide/tateyokohi_ng20221104.jpg|https://suneight.design/takedaguide/img/tateyokohi_ng20221104.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/tateyokohi_ng20221104.jpg"/><figcaption>キャラクターの縦横比NG・OK比較</figcaption></figure></div><div class="original-item"><h3>キャラクターデータ等を加工して、新たなデザインを作成することはできない。</h3></div><div class="original-item"><h3>キャラクターに吹き出しを付けないでください。</h3><p>キャラクターが何か言っているような使い方はできません。</p><figure class="source-figure"><img alt="キャラクターの吹き出し表現のNG例" data-fallbacks="https://suneight.design/takedaguide/fukidashi_ng20221104.jpg|https://suneight.design/takedaguide/img/fukidashi_ng20221104.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/fukidashi_ng20221104.jpg"/><figcaption>キャラクターの吹き出し表現のNG例</figcaption></figure></div><div class="original-item"><h3>キャラクターの顔に他のもの（イラスト・文字など）を被せない。</h3><figure class="source-figure"><img alt="キャラクターの顔に文字・イラストを重ねるNG例" data-fallbacks="https://suneight.design/takedaguide/Face_ng20221104.jpg|https://suneight.design/takedaguide/img/Face_ng20221104.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/Face_ng20221104.jpg"/><figcaption>キャラクターの顔に文字・イラストを重ねるNG例</figcaption></figure></div><div class="original-item"><h3>キャラクターを過剰に詰め込みすぎない。</h3><figure class="source-figure"><img alt="キャラクターの過剰配置NG例" data-fallbacks="https://suneight.design/takedaguide/tayo_ng20221104.jpg|https://suneight.design/takedaguide/img/tayo_ng20221104.jpg" decoding="async" loading="lazy" src="https://suneight.co.jp/takedaguide/img/tayo_ng20221104.jpg"/><figcaption>キャラクターの過剰配置NG例</figcaption></figure></div><div class="original-item"><ul class="source-bullets"><li>印刷販促物や看板・バナー等の販促物に使用する場合には、別途デザイン審査が必要。</li><li>校舎内掲示物に使用する場合には審査は不要だが、キャラクターのイメージを損なうような使用はしない。</li><li>第三者へ譲渡や転貸を行わない。</li><li>本ガイドラインに違反した使用はイメージキャラクターの使用ルール違反と同等に取り扱います。</li></ul></div></section><section class="original-chapter"><h2>雛形素材ダウンロード</h2><p>雛形素材のダウンロード先は、元ガイドラインから移動しています。指定の正規素材をご利用ください。</p></section><section class="original-chapter"><h2>お問い合わせ</h2><p>株式会社Suneight<br/>デジタルコンテンツ部 デザインセクション<br/>TEL：03-6709-9302</p></section></template><template id="video-template"><div  id="video-guides">
<h2 class="subheading">台本審査ガイド</h2><div class="review-grid"><div class="review-item"><h3>編集可能な形式で提出</h3><p>指定のExcelフォーマットを使用し、画像化・PDF化せず提出する。</p></div><div class="review-item"><h3>テロップの句読点</h3><p>原則「、」「。」を使わず、半角スペース・「・」・色やデザインで調整。固有名詞とキャッチコピーは例外。</p></div><div class="review-item"><h3>ナレーションの文字数</h3><p>1秒あたり6〜8文字が目安。60文字なら約7.5〜10秒。息継ぎ・間も考慮。</p></div><div class="review-item"><h3>文法と日本語</h3><p>「食べれる」→「食べられる」、「してない」→「していない」。い抜き・ら抜きに注意。</p></div><div class="review-item"><h3>人称・話し方</h3><p>一貫性を持ち、ターゲットに内容が伝わる構成にする。</p></div><div class="review-item"><h3>改行</h3><p>文節・単語・全体の意味を意識した自然な位置で改行する。</p></div></div><div class="section-block"><h3>テロップ表現の例</h3><p>「入力、修正、完成まで」→「入力・修正・完成まで」／「一番人気な」→「一番 人気な」</p></div>
<h2 class="subheading">動画審査ガイド</h2><div class="review-grid"><div class="review-item"><h3>文字数・安全範囲</h3><p>文字は端的に。各媒体の縦型動画セーフティエリア内に配置。</p></div><div class="review-item"><h3>音声なしの説明テロップ</h3><p>1秒あたり10文字、最低2秒以上を目安。長文が続く際は読み上げられる尺を確保。</p></div><div class="review-item"><h3>コメントフォロー</h3><p>「いろんな」→「いろいろな」、「っていう」→「という」、「ほんとに」→「本当に」。</p></div><div class="review-item"><h3>基本カット尺</h3><p>原則1カット2秒以上。会話やナレーションの区切りに合わせて切り替え。</p></div><div class="review-item"><h3>意図的な演出の例外</h3><p>視覚的な印象を狙う瞬間表示・強調のための途中カットアウトなどは例外。ただし見やすさを損なわないこと。</p></div><div class="review-item"><h3>各カットの狙い</h3><p>画と文字の意味を意識し、一見した視聴者の記憶に残る内容を目指す。</p></div></div>
<h2 class="subheading">修正版提出</h2><div class="section-block"><h3>修正箇所の報告方法</h3><ul><li>指摘ごとに対応内容とタイムコードを記載</li><li>前回の指摘と修正箇所を照合可能にする</li><li>未対応項目の理由を記載</li><li>指摘以外に追加変更した箇所も記載</li><li>提出前に動画全体の見やすさ・聞こえ方を確認</li></ul><p><strong>記載例</strong>　00:12 顔に重なったテロップを下へ移動／00:24 説明文を短縮し、表示時間を5秒に変更</p></div>
<div class="noticebar">申請時には校舎名・動画名（依頼日_タイトル_版数）・使用目的／対象者・公開媒体・公開希望日をご用意ください。公開希望日は確約ではありません。</div>
<div class="process-block"><h2 class="subheading">審査の流れ</h2><p class="process-caption">台本審査の依頼から校了まで、資料記載の最短目安は12営業日です。</p><div class="flow"><div class="flow-item"><strong>01｜申請</strong>審査依頼フォーム・台本（動画）提出</div><div class="flow-item"><strong>02｜6営業日</strong>審査結果通知・修正指示</div><div class="flow-item"><strong>03｜修正・制作</strong>台本修正稿／動画初稿を提出</div><div class="flow-item"><strong>04｜6営業日</strong>再審査・結果通知・修正指示</div><div class="flow-item"><strong>05｜校了</strong>修正稿提出・最終確認</div></div><p class="caption">※修正回数・提出タイミングにより必要日数は変動します。公開希望日の確約ではありません。</p></div></div></template><template id="ai-process-template"><div class="process-block" id="ai-video-process"><h2 class="subheading">審査の流れ</h2><p class="process-caption">AI生成素材を使用する動画も、通常動画と同じ審査手順に従います。</p><div class="flow"><div class="flow-item"><strong>01｜申請</strong>申請フォーム・台本（動画）提出</div><div class="flow-item"><strong>02｜6営業日</strong>審査結果通知・修正指示</div><div class="flow-item"><strong>03｜修正・制作</strong>台本修正稿／動画初稿</div><div class="flow-item"><strong>04｜6営業日</strong>再審査・結果通知</div><div class="flow-item"><strong>05｜校了</strong>修正稿提出・校了</div></div><p class="caption">※基準案の工程を掲載しています。正式な運用は本部承認後に確定します。</p></div></template>
<script>const RULES={"ai":[["公式ロゴのAI改変禁止","ロゴをAIで再生成・変形・色変更しない。正規データを配置。","生成した偽ロゴ","配布された正規ロゴ"],["参考デザインの模倣禁止","Pinterest・SNS等の第三者のデザインを読み込ませ同一・酷似する画像を生成しない。","他者の広告を再現","独自の構成で制作"],["著作物の無断使用禁止","権利のない写真・イラスト・キャラクター等を使用しない。","無許可の素材","権利確認済み素材"],["実在人物の無断再現禁止","生徒・講師・著名人等の容姿を無断で生成・改変しない。","実在人物の無断AI合成","許可済み写真や適切な素材"],["虚偽情報の掲載禁止","合格実績・口コミ・料金・校舎情報をAIに捏造させない。","根拠のない「合格者100人」","確認済みの実績表記"],["生成画像の破綻確認","手指・顔・背景・ロゴ等の不自然さを最終確認する。","不自然な手指や背景","破綻のない画像"],["機密情報のAI入力禁止","生徒の個人情報や社内の非公開情報を無許可で入力しない。","生徒名簿を入力","公開可能な情報のみ"],["AI制作物の責任の所在","内容・権利・品質・公開可否は加盟校または本部が確認する。","「AIが作ったから」未確認","担当者が確認・承認"],["ブランドルールの遵守","武田塾の指定カラー・フォント・ロゴ配置を遵守する。","規定外の配色・書体","公式ガイドラインに準拠"],["文字・レイアウトの正確性","誤字・脱字・文字化け・架空文字を防ぎ、整列と余白を確認。","無料受騒相談 受村中","無料受験相談 受付中"]],"web":[["指定サイズの遵守","掲載媒体のサイズ・アスペクト比を遵守する。","縦横比を無視した配置","指定の幅・高さで書き出し"],["可読性・視認性","スマホでも読める文字サイズ・コントラスト・余白を確保。","背景と同化した小さい文字","十分な文字サイズと明度差"],["画像品質の確保","ぼやけ・低解像度・意図しないトリミングを防ぐ。","拡大で粗い画像","鮮明な画像"],["表示環境への対応","スマホ・PCで崩れないかを確認する。","スマホで要素が見切れる","各端末で適切に表示"],["リンク・QRコードの動作","URL・QRコードの遷移先を実機で確認する。","AI生成の架空QR","正規QRと実機検証"]],"print":[["塗り足し・裁ち落とし","印刷会社指定の塗り足しを設け、安全余白を確保する。","仕上がり位置で背景が終了","裁ち落とし外まで背景"],["印刷用カラーモード","印刷会社指定の色空間・プロファイルを使用する。","RGBで無確認の入稿","印刷条件に適した設定"],["適切な画像解像度","印刷原寸で十分な画像解像度を確保する。","低解像度を大きく拡大","原寸で適切な解像度"],["フォント処理","指定に応じて埋め込み・アウトライン化する。","フォント置換で文字崩れ","埋め込み・アウトライン確認"],["入稿データの適正化","PDF形式・トンボ・仕上がり寸法を印刷会社の規定に合わせる。","寸法・PDF設定に不備","仕様に沿った入稿PDF"]],"videoai":[["AI生成映像の破綻","人物・手指・動き・背景の連続性が自然か確認する。","動作中に手指が増減","自然な動き・連続性"],["ロゴ・文字の再生成禁止","正規の武田塾ロゴ・校舎名・看板等をAIで描き直さない。","AIで崩れたロゴ","正規データを後から配置"],["人物・肖像の権利","本人の許可のない人物・声の再現やなりすましを行わない。","無許可の顔・声クローン","許諾済みの素材"],["外部作品の模倣禁止","参考動画を入力して構図・演出・特徴を酷似させない。","参考動画をほぼ再現","独自の演出・編集"],["虚偽・誤認を招く映像","実際の生徒・実績・校舎と誤認される架空表現を掲載しない。","架空の合格生徒の証言","事実確認した表現"],["動画全体の整合性","前後カットで衣装・顔・背景・位置関係が矛盾しないか確認。","カットごとに顔が変化","一貫した人物・空間"],["素材の使用条件","生成サービスの規約や音源・素材の利用条件を確認する。","利用不可素材を掲載","利用条件を確認"],["公開前の人による確認","AI生成のまま提出せず、実写部分も含めて目視・試聴する。","AI出力を未確認で提出","担当者が全編確認"]],"videobasic":[["テロップサイズ・装飾","スマートフォンでも無理なく読めるサイズ・太さにする。背景とのコントラストを確保。","小さい・細い・背景と同系色","十分な大きさ・補色やベース"],["コメントフォロー","説明テロップと強調デザインの役割を分ける。","同じ見た目で役割が不明","役割を明確に区別"],["テロップデザイン","シンプルで動画の雰囲気に合う表現を基本とする。","過剰な装飾・奇抜・色が多い","見やすく一貫した装飾"],["ナレーション","聞き取りやすい速度と自然な抑揚を確保する。","早口すぎる・単調","自然な速度と抑揚"],["エフェクト","視覚的な狙いがある場合のみ使用する。","意図なく何でも付ける","印象を強める適切な使用"],["AI生成素材","位置・背景・ロゴに矛盾や破綻がないこと。","位置関係の矛盾・ロゴ崩れ","整合性を確認した素材"],["カットつなぎ","同ポジの連続・中途半端なサイズ変化・ライン越えで混乱を生まない。","不自然な切り返し","位置関係が明瞭な編集"],["撮影素材","画が安定し主役にピントが合っていること。識別可能な顔には許可が必要。","意図しないブレ・ボケ・無許可の顔","安定した画・許諾確認"]]};
const state={step:0,type:null,medium:null,ai:null};const $=id=>document.getElementById(id);const names={review:'デザイン審査基準',web:'Webガイドライン',print:'印刷物ガイドライン',ai:'AI静止画ガイドライン',videobasic:'動画ガイドライン',videoai:'AI動画ガイドライン'};
function begin(){state.step=0;state.type=null;state.medium=null;state.ai=null;renderStep();}
function renderStep(){ $('step-screen').classList.remove('hidden');$('result-screen').classList.add('hidden');const isStill=state.type==='still';let steps=state.step; $('step-kicker').textContent=steps===0?'':'STEP '+String(steps+1).padStart(2,'0');$('step-title').textContent=steps===0?'制作物を選択してください':(steps===1&&isStill?'制作する媒体を選択してください':'AIを使用しますか？');const back=$('back-zone');back.replaceChildren();if(steps>0){const b=document.createElement('button');b.className='back-btn';b.textContent='← 前の選択に戻る';b.addEventListener('click',()=>{state.step--;renderStep()});back.append(b)}const choices=steps===0?[['静止画','still'],['動画','video']]:steps===1&&isStill?[['Web','web'],['印刷物','print']]:[['使用する',true],['使用しない',false]];const list=$('choice-list');list.replaceChildren();choices.forEach(([label,value])=>{const b=document.createElement('button');b.className='select-card';const name=document.createElement('span');name.className='name';name.textContent=label;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';b.append(name,arrow);b.addEventListener('click',()=>{if(steps===0){state.type=value;state.step=1;}else if(steps===1&&isStill){state.medium=value;state.step=2;}else{state.ai=value;renderResult();return;}renderStep();});list.append(b)});window.scrollTo(0,0)}
function makeCard(rule,index){const article=document.createElement('article');article.className='card';const title=document.createElement('div');title.className='card-title';const num=document.createElement('span');num.className='no';num.textContent=String(index+1).padStart(2,'0');const t=document.createElement('span');t.textContent=rule[0];title.append(num,t);const p=document.createElement('p');p.className='detail';p.textContent=rule[1];const pair=document.createElement('div');pair.className='pair';[['× NG',rule[2],'bad'],['○ OK',rule[3],'good']].forEach(([n,v,k])=>{let e=document.createElement('div');const label=document.createElement('div');label.className='ex-label '+k;label.textContent=n;const box=document.createElement('div');box.className='sample '+k;box.textContent=v;e.append(label,box);pair.append(e)});article.append(title,p,pair);return article;}
function renderResult(){const isStill=state.type==='still';const parts=['review'];parts.push(isStill?(state.medium==='web'?'web':'print'):'videobasic');if(state.ai)parts.push(isStill?'ai':'videoai');$('step-screen').classList.add('hidden');$('result-screen').classList.remove('hidden');let chain=isStill?'静止画 / '+(state.medium==='web'?'Web':'印刷物'):'動画';chain+=' / '+(state.ai?'AI使用':'AI未使用');$('result-title').textContent=chain+' のガイドライン';$('route-tags').replaceChildren();const tags=isStill?['静止画',state.medium==='web'?'Web':'印刷物',state.ai?'AI使用':'AI未使用']:['動画',state.ai?'AI使用':'AI未使用'];tags.forEach((x,i)=>{if(i){const sep=document.createElement('span');sep.className='sep';sep.textContent='›';$('route-tags').append(sep)}const e=document.createElement('span');e.textContent=x;$('route-tags').append(e)});
const body=$('result-body');body.replaceChildren();$('result-toc').replaceChildren();parts.forEach((key,i)=>{const section=document.createElement('section');section.className='guide-part';section.id='part-'+key;const h=document.createElement('h2');h.className='guide-part-title';const seq=document.createElement('span');seq.className='seq';seq.textContent=String(i+1).padStart(2,'0');h.append(seq,document.createTextNode(names[key]));section.append(h);if(key==='review'){const clone=$('review-template').content.cloneNode(true);clone.querySelectorAll('.apply-panel,.review-warning').forEach(x=>x.remove());section.append(clone)}else{if(key==='ai' || key==='videoai'){const n=document.createElement('div');n.className='responsibility-copy';n.textContent='AI生成物の内容・権利・品質は、制作・利用する加盟校または武田塾本部が確認してください。制作前に本サイトの該当ガイドラインをAIに読み込ませ、未確認のまま審査へ提出しないでください。';section.append(n)}const cards=document.createElement('div');cards.className='cards';(RULES[key]||[]).forEach((rule,j)=>cards.append(makeCard(rule,j)));section.append(cards);if(key==='videobasic'){const tmpl=$('video-template').content.cloneNode(true);section.append(tmpl)}if(key==='videoai'){const warn=document.createElement('p');warn.className='responsibility-copy';warn.textContent='AI動画に関する追加基準は未承認案です。通常の動画審査基準も併せて適用します。';section.append(warn)}}body.append(section);const jump=document.createElement('button');jump.textContent=String(i+1).padStart(2,'0')+' '+names[key];jump.addEventListener('click',()=>section.scrollIntoView({behavior:'smooth',block:'start'}));$('result-toc').append(jump)});window.scrollTo(0,0)}
$('restart-btn').addEventListener('click',begin);$('apply-btn').addEventListener('click',()=>alert('審査依頼フォームの遷移先URLは未設定です。正式なURL確定後に接続します。'));
document.querySelectorAll('img[data-fallbacks]').forEach(img=>{let urls=(img.dataset.fallbacks||'').split('|').filter(Boolean),i=0;img.addEventListener('error',()=>{if(i<urls.length)img.src=urls[i++];else img.closest('figure')?.classList.add('is-missing')})});begin();</script></body></html>
